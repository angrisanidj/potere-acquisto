name: Aggiorna indice FOI

on:
  schedule:
    # Il 20 di ogni mese alle 06:00 UTC: ISTAT pubblica il FOI definitivo
    # del mese precedente intorno a metà mese.
    - cron: "0 6 20 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-foi
  cancel-in-progress: false

jobs:
  update:
    # Versione fissa invece di ubuntu-latest: ubuntu-latest passa a Ubuntu 26.04
    # con un rilascio graduale dal 19 ottobre al 19 novembre 2026
    # (actions/runner-images#14748), e il primo run programmato è il 20 ottobre.
    # Così l'ambiente non cambia sotto il workflow; il passaggio a 26.04 si fa a
    # mano, con un avvio di prova.
    runs-on: ubuntu-24.04
    # Richieste all'ISTAT: 2 (FOI) + 3 (retribuzioni) + 1 (indice per sezione),
    # distanziate di almeno 40 s, più 1 richiesta all'albero degli Osservatori INPS.
    # Caso normale: circa 4 minuti. Caso peggiore, ogni script fermo sull'ultima
    # richiesta dopo risposte lente, con n richieste:
    # (n - 1) x (180 + 40) + 3 x 180 + 60 + 120 secondi, cioè 940 + 1160 + 720 =
    # 2820 s, più 120 s per il controllo INPS: circa 50 minuti con l'installazione.
    # 60 minuti lasciano margine.
    timeout-minutes: 60
    env:
      # output degli script nel log subito, non tutto a fine passo
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Gli script sono indipendenti: se uno fallisce (API irraggiungibile o
      # validazione fallita) lascia intatto il proprio file, l'altro va avanti
      # e il suo aggiornamento viene comunque committato. Il job fallisce
      # nell'ultimo passo.
      - name: Scarica e valida la serie FOI
        id: foi
        continue-on-error: true
        run: python scripts/update_foi.py

      - name: Scarica e valida le retribuzioni contrattuali
        id: retr
        continue-on-error: true
        run: python scripts/update_retribuzioni.py

      - name: Aggiorna i coefficienti dell'indice contrattuale per sezione
        id: indice
        continue-on-error: true
        run: python scripts/update_indice_ateco.py

      # Solo un controllo: avvisa se l'INPS ha pubblicato la tavola di un anno
      # nuovo (la raccolta si lancia a mano con "Raccolta INPS"); non fallisce mai.
      - name: Controlla nuove tavole INPS
        run: python scripts/check_inps.py

      # last_checked cambia a ogni esecuzione riuscita, quindi c'è sempre un
      # commit mensile: evita che GitHub disattivi il workflow schedulato
      # dopo 60 giorni di inattività del repository.
      - name: Commit e push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/foi.json data/retribuzioni.json data/indice_ateco.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare"
            exit 0
          fi
          FOI=$(python -c "import json; print(json.load(open('data/foi.json'))['last_month'])" 2>/dev/null || echo n/d)
          RETR=$(python -c "import json; print(json.load(open('data/retribuzioni.json'))['last_month'])" 2>/dev/null || echo n/d)
          IND=$(python -c "import json; print(json.load(open('data/indice_ateco.json'))['index_last_month'])" 2>/dev/null || echo n/d)
          git commit -m "Aggiorna dati (FOI: ${FOI}, retribuzioni: ${RETR}, indice per sezione: ${IND})"
          git pull --rebase --quiet
          git push

      # Con continue-on-error un passo fallito risulta comunque "success":
      # qui il fallimento diventa un'annotazione visibile nel riepilogo del run.
      - name: Esito degli aggiornamenti
        if: steps.foi.outcome == 'failure' || steps.retr.outcome == 'failure' || steps.indice.outcome == 'failure'
        env:
          FOI_OUTCOME: ${{ steps.foi.outcome }}
          RETR_OUTCOME: ${{ steps.retr.outcome }}
          IND_OUTCOME: ${{ steps.indice.outcome }}
        run: |
          if [ "$FOI_OUTCOME" = "failure" ]; then
            echo "::error title=Aggiornamento fallito::scripts/update_foi.py è fallito: data/foi.json non è stato aggiornato (dettagli nel passo 'Scarica e valida la serie FOI')"
          fi
          if [ "$RETR_OUTCOME" = "failure" ]; then
            echo "::error title=Aggiornamento fallito::scripts/update_retribuzioni.py è fallito: data/retribuzioni.json non è stato aggiornato (dettagli nel passo 'Scarica e valida le retribuzioni contrattuali')"
          fi
          if [ "$IND_OUTCOME" = "failure" ]; then
            echo "::error title=Aggiornamento fallito::scripts/update_indice_ateco.py è fallito: data/indice_ateco.json non è stato aggiornato (dettagli nel passo 'Aggiorna i coefficienti dell'indice contrattuale per sezione')"
          fi
          exit 1
